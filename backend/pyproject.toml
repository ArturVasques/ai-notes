[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-notes"
version = "1.0.0"
description = "AI Notes: FastAPI backend with an OpenAI Agents SDK assistant, tools and RAG over user notes on PostgreSQL + pgvector."
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "openai-agents",
    "pydantic-settings",
    "psycopg[binary,pool]",
    "pgvector",
    "alembic",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # FastAPI's Depends()/Header()/File() in argument defaults is the
    # documented, idiomatic pattern, not a real mutable-default hazard.
    "B008",
]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory must not make the installed
# `alembic` package look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Integration tests intentionally assert on the database driver's generic
# constraint-violation exception rather than a specific driver class.
"tests/integration/*.py" = ["B017"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
files = ["app", "tests", "evals", "alembic/env.py", "main.py"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["agents.*", "agents", "pgvector.*"]
ignore_missing_imports = true