# LOCAL DEVELOPMENT ONLY.
#
# This file describes the developer's laptop environment and nothing else.
# It is not a production deployment descriptor and must never be used as one:
#
#   - PostgreSQL runs with the throwaway credentials postgres/postgres.
#   - Configuration is inlined here or read from the local .env file; the
#     Entra identifiers must come from the shell or the root .env.
#   - The API is published on a plain HTTP port with no TLS or ingress.
#
# Production runs the same Docker image with APP_ENV=production and every
# setting injected by the deployment platform (container environment,
# Key Vault, App Configuration), never from this file or from a .env file.
# See README.md "Environments".

# Fixed project name so container, network and volume names do not depend on
# the local folder name.
name: personal-finance

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: personal_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      # APP_ENV is irrelevant to migrations but is kept "development" so this
      # file reads unambiguously as a local stack.
      APP_ENV: development
      LOG_LEVEL: INFO

      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: personal_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      # Settings are validated as a whole, so migrations need the Entra
      # identifiers too even though they never validate a token.
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in your shell or in .env (see backend/.env.example)}
      ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:?Set ENTRA_API_CLIENT_ID in your shell or in .env (see backend/.env.example)}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: personal_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      # Public identifiers of the Entra tenant and API app registration
      # (see backend/.env.example). Never a client secret.
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in your shell or in .env (see backend/.env.example)}
      ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:?Set ENTRA_API_CLIENT_ID in your shell or in .env (see backend/.env.example)}
      ENTRA_REQUIRED_SCOPE: ${ENTRA_REQUIRED_SCOPE:-access_as_user}
    ports:
      # Override with API_PORT for a separate stack (e.g. a smoke test run
      # with `docker compose -p personal-finance-smoke`) so it does not collide with an
      # already-running default stack on 8000.
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: