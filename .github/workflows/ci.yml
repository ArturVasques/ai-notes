name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest

    # Backend jobs run from the backend/ project directory.
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy

  unit-tests:
    runs-on: ubuntu-latest

    # Backend jobs run from the backend/ project directory.
    defaults:
      run:
        working-directory: backend

    env:
      # No PostgreSQL service is attached to this job on purpose and
      # POSTGRES_PORT points at a closed port: the unit suite must pass with
      # no database reachable. The OpenAI key is a placeholder that is never
      # used for a call; it only satisfies AISettings when the HTTP-level
      # tests import the application.
      APP_ENV: test
      LOG_LEVEL: INFO
      POSTGRES_PORT: "1"
      POSTGRES_PASSWORD: unused-in-unit-tests
      OPENAI_API_KEY: unit-tests-never-call-openai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: pytest tests/unit -v --cov=app --cov-report=term-missing

  integration-tests:
    runs-on: ubuntu-latest

    # Backend jobs run from the backend/ project directory.
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: ai_notes
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      LOG_LEVEL: INFO

      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ai_notes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      RAG_TOP_K: 5
      RAG_MAX_DISTANCE: 0.8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest tests/integration -v

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests]

    env:
      # Placeholder only: the smoke test never calls OpenAI. It exists so the
      # api service can start (AISettings requires a non-empty key).
      OPENAI_API_KEY: ci-smoke-never-calls-openai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build images and start the stack
        run: docker compose up --build --detach

      - name: Wait for the API to be ready
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8000/health/ready; then
              echo
              echo "API ready after ${attempt} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "API did not become ready in time"
          exit 1

      - name: Assert container healthcheck and non-root user
        run: |
          for attempt in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q api)")
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "healthcheck: $status"
          [ "$status" = "healthy" ]
          docker compose exec -T api id -u | grep -qv '^0$'

      - name: Seed the development user inside the container
        run: docker compose run --rm --no-deps api python -m app.database.seed

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
