name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest

    # Backend jobs run from the backend/ project directory.
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy

  unit-tests:
    runs-on: ubuntu-latest

    # Backend jobs run from the backend/ project directory.
    defaults:
      run:
        working-directory: backend

    env:
      # No PostgreSQL service is attached to this job on purpose and
      # POSTGRES_PORT points at a closed port: the unit suite must pass with
      # no database reachable.
      APP_ENV: test
      LOG_LEVEL: INFO
      POSTGRES_PORT: "1"
      POSTGRES_PASSWORD: unused-in-unit-tests
      # Placeholders: the unit suite never contacts Entra. Tests build their
      # own settings or replace the authentication dependency.
      ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
      ENTRA_API_CLIENT_ID: 00000000-0000-0000-0000-000000000000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: pytest tests/unit -v --cov=app --cov-report=term-missing

  integration-tests:
    runs-on: ubuntu-latest

    # Backend jobs run from the backend/ project directory.
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: personal_finance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      LOG_LEVEL: INFO

      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: personal_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      # Placeholders: integration tests replace the authentication
      # dependency and never contact Entra.
      ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
      ENTRA_API_CLIENT_ID: 00000000-0000-0000-0000-000000000000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest tests/integration -v

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests]

    env:
      # Placeholders so the stack starts; the smoke test only calls the
      # unauthenticated health endpoints.
      ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
      ENTRA_API_CLIENT_ID: 00000000-0000-0000-0000-000000000000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build images and start the stack
        run: docker compose up --build --detach

      - name: Wait for the API to be ready
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8000/health/ready; then
              echo
              echo "API ready after ${attempt} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "API did not become ready in time"
          exit 1

      - name: Assert container healthcheck and non-root user
        run: |
          for attempt in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q api)")
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "healthcheck: $status"
          [ "$status" = "healthy" ]
          docker compose exec -T api id -u | grep -qv '^0$'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
